<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stanza Client Portal</title>
<meta name="description" content="Stanza Interior Design & Decoration — client portal for project progress, drawings, documents and payments.">
<meta name="theme-color" content="#e85d04">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stanza">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="apple-touch-icon" href="/logo-mark.png">
<link rel="stylesheet" href="/app.css">
<!-- Google Fonts is the one thing still fetched from outside this site,
     and it is blocked on some Myanmar networks. Loaded as print and
     switched on once it arrives, so a blocked or slow request can never
     hold up the portal: the page draws immediately in the fallback
     faces named in app.css, and the proper ones swap in if they come. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+Myanmar:wght@400;500;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+Myanmar:wght@400;500;600&display=swap"></noscript>
</head>
<body>
  <div id="app"><div class="boot-splash">Loading…</div></div>

  <script src="/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
